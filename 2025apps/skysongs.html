<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* 기본 스타일링 */
    html {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      /* align-items: center; */
      width: 100wh;
      height: 100vh;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 100%;
      height: 100%;
    }

    .header {
      width: 100%;
      height: 40px;
      display: flex;
      justify-content: flex-end;
    }

    .header .text {
      padding: 10px;
    }

    .target {
      width: 100%;
      height: 100%;
    }

    .title {
      /* background-color: #fff; */
      /* border-radius: 8px; */
      /* box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); */
      padding: 8px 0px;
      margin-top: 10px;
      text-align: center;
      text-decoration: none;
      display: block;
      font-weight: bold;
    }
    .card {
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      padding: 8px 0px;
      margin: 4px;
      text-align: center;
      text-decoration: none;
      display: block;
    }

    .card:active {
      background-color: lightgreen;
    }

    .card-title {
      font-size: 1.5rem;
      margin-bottom: 4px;
      color: #333;
      font-weight: bold;
      display: block;
    }

    .card-text {
      font-size: 1rem;
      color: #666;
      line-height: 1.6;
      display: block;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header" onClick="onNewFunction()">
      <div class="text">NEW</div>
    </div>
    <div class="target">
      <!-- <div class="card">
        <h2 class="card-title">Card Title</h2>
        <a class="card-text" href="http://naver.com" target="_blank">Lorem ipsum dolor sit amet</a>
      </div> -->
    </div>
  </div>
  <script>
    function onNewFunction() {
      start(true);
    }

    function convertSheetToObj(rows) {
      console.log('rows', rows);
      var resultList = [];
      rows.forEach(row => {
        resultList.push({
          title: row.c[0]?.v || '',
          type: row.c[1]?.v || '', // text or link
          url: row.c[2]?.v || '',
        })
      });
      return resultList;
    }
    async function api(url, key) {
      console.log('url', url);
      return new Promise((resolve, reject) => {
        fetch(url)
          .then(response => response.text())
          .then(text => {
            const json = JSON.parse(text.substring(47, text.length - 2)); // JSONP 형식 제거
            console.log('json', json);

            var resultList = convertSheetToObj(json.table.rows);
            console.log('resultList', resultList);

            window.localStorage.setItem(key, JSON.stringify(resultList));
            resolve(resultList);
          })
          .catch(error => {
            console.error("Error:", error);
            reject(error);
          });
      });
    }
    async function start(isNew) {
      // var list = [{
      //   title: 'titf sdf sf sf sdf sddslkjfsdlkfjlksdjkflsdjlkfjlkdsjflkdsjlkjf sd fle',
      //   subTitle: 'fdsf sdf sf sfflkesdjlkfjlskdflkdsjfk ljdsklfjlsdkjfldskjd ',
      //   url: 'fds',
      // }];
      var list = await getList(isNew);
      console.log('list', list);
      
      var html = '';
      for (let i = 0; i < list.length; i++) {
        var item = list[i];
        if (item.type === 'text') {
          html += `<div class="title">${item.title}</div>`;
        } else if (item.type === 'link') {
          html += `<a class="card" href="${item.url}" target="_blank">${item.title}</a>`
        } else {
        }
      }
      
      document.querySelector('.target').innerHTML = html;
    }
    async function getList(isNew) {
      var sheetId = new URL(location.href).searchParams.get('sheetId');
      var sheetNm = new URL(location.href).searchParams.get('sheetNm');
      var key = `${sheetId}-${sheetNm}`;

      if (isNew) {

      } else {
        var cached = window.localStorage.getItem(key);
        if (cached !== null && cached !== undefined) {
          console.log('cached', cached);
          return JSON.parse(cached);
        }
      }

      var googleSheetJson = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${sheetNm}`;
      var resultList = await api(googleSheetJson, key);
      return resultList;
    }

    start(false);

  </script>
</body>

</html>
