<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정보시스템감리사 기출 퀴즈</title>
  <style>
    :root {
      --bg: #fff; --fg: #1d2127; --muted: #6b7280; --line: #e3e6ea;
      --soft: #f6f7f9; --accent: #2563eb;
      --ok: #16a34a; --ok-bg: #e9f8ee; --ng: #dc2626; --ng-bg: #fdeceb;
      --head: 104px; --header: 42px;
    }
    * { box-sizing: border-box; }
    /* hidden 속성이 항상 이기도록. 작성자 스타일의 display 지정(예: #sidebar 의
       display:flex)이 브라우저 기본 [hidden]{display:none} 보다 우선하기 때문에
       이 규칙이 없으면 hidden 을 붙여도 요소가 사라지지 않는다. */
    [hidden] { display: none !important; }
    body {
      margin: 0; color: var(--fg); background: var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      font-size: 15px; line-height: 1.65;
    }

    /* ---------- 헤더 ---------- */
    header {
      position: sticky; top: 0; z-index: 20; background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .spacer { flex: 1; }
    .tabs { display: flex; align-items: center; gap: 2px; padding: 0 8px; }
    .tabs button {
      border: none; border-bottom: 2px solid transparent; background: none;
      padding: 10px 12px; font-size: 14px; color: var(--muted); cursor: pointer;
    }
    .tabs button.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
    .tabs button.icon {
      display: flex; align-items: center; padding: 10px 8px; color: var(--fg); border-bottom: none;
    }

    /* 로그인 여부 표시 */
    .dot {
      width: 8px; height: 8px; border-radius: 50%; margin-right: 8px;
      background: var(--line); flex: none;
    }
    .dot.on { background: var(--ok); }

    /* 시트 저장 중 표시 */
    .saving {
      width: 14px; height: 14px; margin-right: 8px; flex: none;
      border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- 사이드바 ---------- */
    #scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 30; }
    #sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; width: min(280px, 82vw); z-index: 31;
      background: var(--bg); border-right: 1px solid var(--line);
      display: flex; flex-direction: column;
      box-shadow: 0 0 24px rgba(0,0,0,.12);
    }
    .side-head {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 10px 12px 16px; border-bottom: 1px solid var(--line);
    }
    .side-head b { flex: 1; font-size: 14px; line-height: 1.4; }
    .side-head button.icon {
      border: none; background: none; padding: 6px; cursor: pointer; color: var(--fg);
      display: flex; align-items: center;
    }
    .side-body { padding: 16px; }
    .side-body p { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
    .side-note { font-size: 12px; line-height: 1.6; margin-top: 14px !important; }
    button.btn.block { display: block; width: 100%; padding: 9px; font-size: 14px; }

    button.btn {
      padding: 5px 11px; border: 1px solid var(--line); border-radius: 6px;
      background: var(--bg); font-size: 13px; cursor: pointer; color: var(--fg);
    }
    button.btn:hover:not(:disabled) { background: var(--soft); }
    button.btn:disabled { opacity: .45; cursor: default; }

    #status { font-size: 12.5px; color: var(--muted); padding: 6px 16px; min-height: 26px; }
    #status.error { color: var(--ng); }
    #syncInfo.error { color: var(--ng); }
    .side-link { display: block; margin-top: 14px; font-size: 13px; color: var(--fg); }
    .side-opt {
      display: flex; align-items: center; gap: 8px; margin-top: 18px; padding-top: 14px;
      border-top: 1px solid var(--line); font-size: 13.5px; cursor: pointer;
    }

    main { padding: 0 16px 48px; }

    /* ---------- 선택 칩 ---------- */
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0; }
    .chips button {
      padding: 5px 13px; border: 1px solid var(--line); border-radius: 999px;
      background: var(--bg); font-size: 13.5px; cursor: pointer; color: var(--fg);
    }
    .chips button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ---------- 대시보드 ---------- */
    .stat-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0; }
    .stat {
      border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; min-width: 104px;
    }
    .stat b { display: block; font-size: 21px; line-height: 1.3; }
    .stat span { font-size: 12px; color: var(--muted); }

    .dash-row { margin-bottom: 18px; }
    .dash-head {
      display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px;
      font-size: 13.5px;
    }
    .dash-head b { font-size: 15px; }
    .dash-head span { color: var(--muted); font-size: 12.5px; }
    .grid { display: grid; grid-template-columns: repeat(40, 1fr); gap: 2px; }
    .grid i {
      aspect-ratio: 1; border-radius: 2px; background: var(--soft);
      border: 1px solid var(--line); cursor: pointer; font-style: normal;
    }
    .grid i.o { background: var(--ok); border-color: var(--ok); }
    .grid i.x { background: var(--ng); border-color: var(--ng); }
    .grid i:hover { outline: 2px solid var(--accent); outline-offset: 1px; }
    @media (max-width: 720px) { .grid { grid-template-columns: repeat(20, 1fr); } }

    .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 10px; }
    .legend span::before {
      content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 2px;
      margin-right: 5px; vertical-align: -1px; border: 1px solid var(--line);
    }
    .legend .l-o::before { background: var(--ok); border-color: var(--ok); }
    .legend .l-x::before { background: var(--ng); border-color: var(--ng); }
    .legend .l-n::before { background: var(--soft); }

    /* ---------- 문제 ---------- */
    .group-title {
      margin: 26px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line);
      font-size: 14px; font-weight: 600; color: var(--muted);
    }
    .q {
      border: 1px solid var(--line); border-radius: 10px;
      padding: 16px 18px; margin-bottom: 14px; max-width: 920px;
    }
    .q-head {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      font-size: 12.5px; color: var(--muted); margin-bottom: 10px;
    }
    .q-no { font-weight: 700; color: var(--fg); font-size: 14px; }
    .tag { border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; }
    .mark { font-weight: 700; font-size: 15px; }
    .mark.o { color: var(--ok); }
    .mark.x { color: var(--ng); }

    .stem { margin-bottom: 14px; }
    .stem img, .expl img { max-width: 100%; display: block; margin: 10px 0; }
    .stem table, .opt table, .expl table { border-collapse: collapse; margin: 10px 0; font-size: 13.5px; }
    .stem th, .stem td, .opt th, .opt td, .expl th, .expl td { border: 1px solid var(--line); padding: 5px 9px; }
    .stem pre, .opt pre, .expl pre {
      background: var(--soft); border: 1px solid var(--line); border-radius: 6px;
      padding: 10px 12px; overflow-x: auto; font-size: 13px; line-height: 1.5; margin: 10px 0;
    }
    .stem code, .opt code, .expl code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
    .stem blockquote, .opt blockquote, .expl blockquote {
      margin: 10px 0; padding: 2px 14px; border-left: 3px solid var(--line); color: #374151;
    }
    .scroll-x { overflow-x: auto; }

    .opts { display: flex; flex-direction: column; gap: 7px; }
    .opt {
      display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%;
      padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--bg); font: inherit; color: inherit; cursor: pointer;
    }
    .opt:hover:not(:disabled) { background: var(--soft); }
    .opt:disabled { cursor: default; }
    .opt .num { flex: none; font-weight: 700; color: var(--muted); }
    .opt .body { flex: 1; min-width: 0; }
    .opt .body > :first-child { margin-top: 0; }
    .opt .body > :last-child { margin-bottom: 0; }
    .opt.correct { background: var(--ok-bg); border-color: var(--ok); }
    .opt.correct .num { color: var(--ok); }
    .opt.wrong { background: var(--ng-bg); border-color: var(--ng); opacity: .75; }
    .opt.wrong .num { color: var(--ng); }

    .q-foot { margin-top: 10px; font-size: 12.5px; color: var(--muted); min-height: 19px; }
    .q-foot.ok { color: var(--ok); }
    .q-foot.ng { color: var(--ng); }
    .expl {
      margin-top: 10px; padding: 10px 12px; border-left: 3px solid var(--ok);
      background: var(--soft); border-radius: 0 6px 6px 0; font-size: 13.5px; line-height: 1.65;
    }
    .expl > b:first-child { display: block; margin-bottom: 4px; color: var(--ok); font-size: 12.5px; }
    .expl p { margin: 0 0 8px; }

    /* ---------- 연도별 모드 (스와이프) ---------- */
    .swiper {
      height: calc(100vh - var(--head)); overflow-y: auto;
      scroll-snap-type: y mandatory; scroll-behavior: smooth;
      margin: 0 -16px; padding: 0 16px;
    }
    .swiper > .slide {
      height: calc(100vh - var(--head)); scroll-snap-align: start; scroll-snap-stop: always;
      display: flex; flex-direction: column; padding: 10px 0 20px;
    }
    .swiper .group-title { flex: none; margin-top: 0; }
    .swiper .q { width: 100%; flex: 0 1 auto; min-height: 0; overflow-y: auto; margin: 0; }
    .nav-float {
      position: fixed; right: 18px; bottom: 18px; z-index: 15;
      display: flex; flex-direction: column; gap: 6px; align-items: center;
    }
    .nav-float .pos {
      background: var(--fg); color: #fff; border-radius: 999px;
      padding: 3px 11px; font-size: 12px; font-variant-numeric: tabular-nums;
    }

    /* 맨 위로 — 스와이프 모드에서는 ▲▼ 버튼 위에 놓는다 */
    #btnTop {
      position: fixed; right: 18px; bottom: 18px; z-index: 15;
      width: 40px; height: 40px; border-radius: 50%; padding: 0;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    #btnTop.above-nav { bottom: 130px; }

    .empty { color: var(--muted); padding: 40px 0; }

    /* ---------- 오른쪽 목차 ---------- */
    main .q, main .group-title { scroll-margin-top: calc(var(--header) + 8px); }
    #toc {
      position: fixed; top: var(--header); right: 0; bottom: 0; width: 250px; z-index: 12;
      background: var(--bg); border-left: 1px solid var(--line);
      display: none; flex-direction: column;
    }
    body.has-toc #toc { display: flex; }
    .toc-head {
      padding: 10px 14px; font-size: 13px; font-weight: 600;
      border-bottom: 1px solid var(--line);
    }
    #tocBody { flex: 1; overflow-y: auto; padding: 8px; }
    .toc-sec + .toc-sec { margin-top: 12px; }
    .toc-group {
      display: flex; flex-direction: column; width: 100%; text-align: left;
      border: none; background: none; padding: 4px 6px; margin-bottom: 4px; border-radius: 6px;
      font-size: 13px; font-weight: 600; line-height: 1.4; cursor: pointer; color: var(--fg);
    }
    .toc-group:hover { background: var(--soft); }
    .toc-group small { color: var(--muted); font-size: 11.5px; font-weight: normal; }
    .toc-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
    .toc-grid.wide { grid-template-columns: repeat(4, 1fr); }
    .toc-grid button {
      border: 1px solid var(--line); border-radius: 4px; background: var(--soft);
      padding: 4px 0; font-size: 12px; cursor: pointer; color: var(--fg);
      font-variant-numeric: tabular-nums;
    }
    .toc-grid button.o { background: var(--ok); border-color: var(--ok); color: #fff; }
    .toc-grid button.x { background: var(--ng); border-color: var(--ng); color: #fff; }
    .toc-grid button:hover { outline: 2px solid var(--accent); outline-offset: 1px; }

    /* 넓은 화면: 오른쪽에 고정 / 좁은 화면: 헤더 버튼으로 여는 서랍 */
    @media (min-width: 1000px) {
      body.has-toc main { margin-right: 250px; }
      body.has-toc .nav-float, body.has-toc #btnTop { right: 268px; }
      #btnToc { display: none !important; }
    }
    @media (max-width: 999px) {
      #toc { top: 0; width: min(260px, 82vw); z-index: 31; box-shadow: 0 0 24px rgba(0,0,0,.12); }
      body.has-toc #toc:not(.open) { display: none; }
    }

    /* ---------- 좁은 화면 ---------- */
    @media (max-width: 600px) {
      body { font-size: 14.5px; }
      main { padding: 0 10px 40px; }
      .swiper { margin: 0 -10px; padding: 0 10px; }
      .q { padding: 12px 13px; border-radius: 8px; }
      .tabs button { padding: 10px 9px; font-size: 13.5px; }
      .opt { padding: 8px 10px; }
      #status { padding: 5px 10px; }
      .nav-float, #btnTop { right: 10px; bottom: 10px; }
      #btnTop.above-nav { bottom: 122px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="tabs">
      <button id="btnMenu" class="icon" aria-label="메뉴 열기" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path d="M2 4.5h14M2 9h14M2 13.5h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <button data-view="dash">대시보드</button>
      <button data-view="subject" class="on">과목별</button>
      <button data-view="year">연도별</button>
      <span class="spacer"></span>
      <span id="saving" class="saving" hidden></span>
      <button id="btnToc" class="icon" aria-label="목차 열기" hidden>
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path d="M6 4.5h10M6 9h10M6 13.5h10M2 4.5h1M2 9h1M2 13.5h1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <span id="authDot" class="dot" title="로그인하지 않음"></span>
    </div>
  </header>

  <div id="scrim" hidden></div>
  <aside id="sidebar" hidden>
    <div class="side-head">
      <b>정보시스템감리사 기출 퀴즈</b>
      <button class="icon" id="btnClose" aria-label="메뉴 닫기">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="side-body">
      <p id="who"></p>
      <button class="btn block" id="btnLogin">Google 로그인</button>
      <button class="btn block" id="btnLogout" hidden>로그아웃</button>
      <p class="side-note" id="sideInfo"></p>
      <p class="side-note" id="syncInfo" hidden></p>
      <a class="side-link" id="sheetLink" target="_blank" rel="noopener">Google 시트 열기 ↗</a>
      <label class="side-opt">
        <input type="checkbox" id="optSwipe">
        스와이프 (한 문제씩 넘기기)
      </label>
    </div>
  </aside>

  <aside id="toc">
    <div class="toc-head" id="tocTitle"></div>
    <div id="tocBody"></div>
  </aside>

  <button class="btn" id="btnTop" aria-label="맨 위로" title="맨 위로" hidden>
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
      <path d="M4 11l5-5 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <div id="status"></div>

  <main>
    <section id="view-dash" hidden></section>
    <section id="view-subject" hidden></section>
    <section id="view-year" hidden></section>
  </main>

  <script src="gsheet.js"></script>
  <script src="quiz-data.js"></script>
  <script>
  /* ==================================================================
   * 설정
   * ================================================================== */

  const SHEET_ID   = '1Sk2oBAoPIo3fCV-vmQHdqgp0GS_ktZSRZS-E0tM7NnY';
  const SHEET_NAME = 'gamri';
  const CLIENT_ID  = '173186405660-6fibo7qvfe1finjsuh8dauqakap37cvg.apps.googleusercontent.com';

  // 시트 1행(헤더) 중 이 앱이 쓰는 열.
  // key / seq / category / question 은 시트에 이미 채워져 있으므로 읽기만 한다.
  const COL_KEY = 'key';
  const COL_ANSWER = 'answer';
  const COL_DATE = 'answer-date';

  GSheet.configure({
    spreadsheetId: SHEET_ID,
    clientId: CLIENT_ID,
    defaultSheet: SHEET_NAME,
    scopes: GSheet.SCOPE_RW,
  });

  const DATA = window.QUIZ_DATA;
  const CIRCLED = ['①', '②', '③', '④'];
  const UNGROUPED = '미분류';

  const $ = (sel, el) => (el || document).querySelector(sel);

  /* ==================================================================
   * 풀이 기록 — 메모리 + Google Sheet
   * ================================================================== */

  const Records = {
    map: new Map(),        // 'Y-N' → { row, choice, result }
    loaded: false,
    unmatched: 0,          // 시트에서 행을 찾지 못한 문항 수
    _queue: Promise.resolve(),
    _pending: 0,

    key: (y, n) => y + '-' + n,

    get(y, n) {
      return this.map.get(this.key(y, n)) || null;
    },

    /**
     * 시트를 읽어 문항별 행 번호와 기존 답안을 적재한다.
     * key / seq / category / question 은 시트에 이미 채워져 있다고 보고 건드리지 않는다.
     */
    async load() {
      const { header, rows } = await GSheet.list();

      if (!header.length) {
        throw new Error('시트 "' + SHEET_NAME + '"가 비어 있습니다. 1행에 헤더가 있어야 합니다.');
      }
      this.header = header;
      const missing = [COL_KEY, COL_ANSWER, COL_DATE].filter((c) => !header.includes(c));
      if (missing.length) {
        throw new Error(
          '시트 "' + SHEET_NAME + '"의 헤더에 [' + missing.join(', ') + '] 열이 없습니다. ' +
          '현재 헤더: [' + header.join(' | ') + ']'
        );
      }

      this.map.clear();
      let matched = 0;

      rows.forEach((r) => {
        const id = parseKey(r[COL_KEY]);
        if (!id) return;

        const choice = parseChoice(r[COL_ANSWER]);
        this.map.set(this.key(id.y, id.n), {
          row: r._row,
          choice: choice || null,
          result: null,        // 정답 여부는 quiz-data 와 대조해 아래에서 채운다
          date: r[COL_DATE] || '',
        });
        matched++;
      });

      // 저장된 답안을 정답과 대조해 O/X 를 복원한다
      DATA.questions.forEach((q) => {
        const rec = this.get(q.y, q.n);
        if (rec && rec.choice) rec.result = q.a.includes(rec.choice) ? 'O' : 'X';
      });

      this.unmatched = DATA.questions.length - matched;
      this.loaded = true;
      return {
        total: rows.length,
        matched,
        // 매칭에 실패했을 때 원인을 보여주기 위한 샘플
        sampleKeys: rows.slice(0, 3).map((r) => String(r[COL_KEY])),
      };
    },

    /**
     * 한 문항의 답안을 기록한다. answer / answer-date 두 열만 수정한다.
     * 쓰기는 순차 처리해서 같은 행에 동시에 쓰는 일을 막는다.
     */
    save(q, rec) {
      // isSignedIn() 으로 막으면 안 된다. 토큰은 1시간이면 만료되는데,
      // 만료 상태라도 _request 가 자동으로 재발급하므로 저장은 계속 가능하다.
      // 기준은 "시트를 읽어둔 상태인가"(= 로그인해서 행 번호를 알고 있는가)다.
      if (!this.loaded) {
        setStatus('로그인하지 않아 이 답안은 시트에 저장되지 않았습니다. ' +
                  '상단의 "Google 로그인"을 눌러주세요.', true);
        blinkLogin();
        return;
      }

      if (!rec.row) {
        setStatus('시트에서 ' + q.y + '-' + String(q.n).padStart(3, '0') +
                  ' 행을 찾지 못해 저장하지 못했습니다. key 열 값을 확인해 주세요.', true);
        return;
      }

      this._pending++;
      updateSyncStatus();

      this._queue = this._queue.then(async () => {
        const data = {};
        data[COL_ANSWER] = rec.choice == null ? '' : rec.choice;   // 1~4 숫자로 기록
        data[COL_DATE] = new Date().toLocaleString('sv-SE');   // YYYY-MM-DD HH:MM:SS
        rec.date = data[COL_DATE];
        await GSheet.update(rec.row, data);
      }).catch((e) => {
        setStatus('시트 저장 실패: ' + e.message, true);
      }).then(() => {
        this._pending--;
        updateSyncStatus();
      });

      return this._queue;
    },
  };

  /**
   * 시트의 key 값에서 (연도, 번호)를 뽑는다.
   * '2021-001', '2021_1', '2021 1번', '2021A001' 같은 표기를 모두 받아들인다.
   */
  /**
   * answer 열의 값을 보기 번호(1~4)로 읽는다.
   * 숫자로 쓰지만, 예전에 원문자(①~④)로 적힌 값도 그대로 읽어들인다.
   */
  function parseChoice(raw) {
    const s = String(raw == null ? '' : raw).trim();
    if (!s) return null;

    const circled = CIRCLED.indexOf(s) + 1;
    if (circled) return circled;

    const n = Number(s);
    return n >= 1 && n <= 4 ? n : null;
  }

  function parseKey(raw) {
    const m = String(raw == null ? '' : raw).match(/(20\d{2})\D{0,3}(\d{1,3})/);
    if (!m) return null;
    const y = Number(m[1]), n = Number(m[2]);
    if (!DATA.years.includes(y) || n < 1 || n > 120) return null;
    return { y, n };
  }

  /* ==================================================================
   * 최소 마크다운 렌더러
   *   지문에 쓰이는 문법만 지원한다 — 코드블록, 표, 인용, 이미지,
   *   인라인 코드, 굵게/기울임. 그 외 입력은 그대로 escape 된다.
   * ================================================================== */

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  function mdToHtml(src) {
    if (!src) return '';
    const blocks = [];

    // 1) 펜스 코드블록을 먼저 빼둔다 (내부를 다른 규칙이 건드리지 못하게)
    let text = String(src).replace(/```[^\n]*\n([\s\S]*?)```/g, (_, code) => {
      blocks.push('<pre><code>' + escapeHtml(code.replace(/\n$/, '')) + '</code></pre>');
      return '@@CODE' + (blocks.length - 1) + '@@';
    });

    text = escapeHtml(text);

    const lines = text.split('\n');
    const out = [];
    let i = 0;

    while (i < lines.length) {
      const line = lines[i];

      // 빼둔 코드블록 자리
      const ph = line.match(/^@@CODE(\d+)@@$/);
      if (ph) { out.push(blocks[Number(ph[1])]); i++; continue; }

      // 표: | ... | 가 연속으로 나오고 두 번째 줄이 구분선
      if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
        const rows = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(lines[i]); i++; }
        out.push(renderTable(rows));
        continue;
      }

      // 인용
      if (/^\s*&gt;\s?/.test(line)) {
        const buf = [];
        while (i < lines.length && /^\s*&gt;\s?/.test(lines[i])) {
          buf.push(lines[i].replace(/^\s*&gt;\s?/, ''));
          i++;
        }
        out.push('<blockquote>' + inline(buf.join('\n')).replace(/\n/g, '<br>') + '</blockquote>');
        continue;
      }

      // 빈 줄
      if (!line.trim()) { i++; continue; }

      // 단락: 빈 줄 또는 다음 블록 시작 전까지.
      // 첫 줄은 무조건 가져가야 한다. 표로 보이지만 구분선이 없는 줄
      // (예: 집합 크기 표기 |R∪S|)에서 i 가 멈추는 것을 막는다.
      const buf = [lines[i]];
      i++;
      while (i < lines.length && lines[i].trim() && !isBlockStart(lines, i)) {
        buf.push(lines[i]);
        i++;
      }
      out.push('<p>' + inline(buf.join('\n')).replace(/\n/g, '<br>') + '</p>');
    }

    return out.join('\n');
  }

  /** lines[i] 가 새 블록(코드블록 자리·인용·표)의 시작인지 */
  function isBlockStart(lines, i) {
    const ln = lines[i];
    if (/^@@CODE\d+@@$/.test(ln)) return true;
    if (/^\s*&gt;\s?/.test(ln)) return true;
    // 표는 구분선이 뒤따를 때만 표로 본다
    return /^\s*\|/.test(ln) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1]);
  }

  function renderTable(rows) {
    const cells = (ln) => ln.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
    const head = cells(rows[0]);
    const body = rows.slice(2).map(cells);
    const th = '<tr>' + head.map((c) => '<th>' + inline(c) + '</th>').join('') + '</tr>';
    const tb = body.map((r) => '<tr>' + r.map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('');
    return '<div class="scroll-x"><table><thead>' + th + '</thead><tbody>' + tb + '</tbody></table></div>';
  }

  function inline(s) {
    return s
      .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,
        (_, alt, src) => '<img src="' + src + '" alt="' + alt + '" loading="lazy">')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,]|$)/g, '$1<em>$2</em>');
  }

  /* ==================================================================
   * 문제 카드
   * ================================================================== */

  function questionCard(q) {
    const rec = Records.get(q.y, q.n);

    const el = document.createElement('article');
    el.className = 'q';
    el.dataset.y = q.y;
    el.dataset.n = q.n;

    const tags = ['<span class="tag">' + q.s + '</span>'];
    if (q.g) tags.push('<span class="tag">' + escapeHtml(q.g) + '</span>');
    if (q.a.length > 1) tags.push('<span class="tag">복수정답</span>');

    el.innerHTML =
      '<div class="q-head">' +
        '<span class="q-no">' + q.y + ' · ' + q.n + '번</span>' +
        tags.join('') +
        (q.t ? '<span>' + escapeHtml(q.t) + '</span>' : '') +
        '<span class="spacer"></span><span class="mark"></span>' +
      '</div>' +
      '<div class="stem">' + mdToHtml(q.q) + '</div>' +
      '<div class="opts">' +
        q.o.map((o, i) =>
          '<button class="opt" data-i="' + (i + 1) + '">' +
            '<span class="num">' + CIRCLED[i] + '</span>' +
            '<span class="body">' + mdToHtml(o) + '</span>' +
          '</button>'
        ).join('') +
      '</div>' +
      '<div class="q-foot"></div>' +
      '<div class="expl" hidden></div>';

    el.querySelector('.opts').addEventListener('click', (e) => {
      const btn = e.target.closest('.opt');
      if (btn && !btn.disabled) choose(q, el, Number(btn.dataset.i));
    });

    paint(q, el, rec);
    return el;
  }

  /** 보기 선택 */
  function choose(q, el, choice) {
    const prev = Records.get(q.y, q.n);
    if (prev && prev.result) {
      // 이미 고른 보기를 다시 누르면 선택을 취소한다 (정답·오답 모두 토글)
      // 맞춘 문제는 다른 보기를 고를 수 없다
      if (choice === prev.choice) {
        prev.choice = null;
        prev.result = null;
        prev.tries = 0;
        paint(q, el, prev);
        Records.save(q, prev);
        if (!$('#view-dash').hidden) renderDash(); else renderToc();
        return;
      }
      if (prev.result === 'O') return;
    }

    // 시트에 없는 문항이면 row 가 없다 (저장 시 안내한다)
    const rec = prev || { row: null, choice: null, result: null, tries: 0 };
    rec.tries = (rec.tries || 0) + 1;     // 시도 횟수는 이번 세션 동안만 센다
    rec.choice = choice;
    rec.result = q.a.includes(choice) ? 'O' : 'X';
    Records.map.set(Records.key(q.y, q.n), rec);

    paint(q, el, rec, choice);
    Records.save(q, rec);
    if (!$('#view-dash').hidden) renderDash(); else renderToc();
  }

  /**
   * 카드에 현재 상태를 반영한다.
   * @param last 이번에 고른 보기 (없으면 복원 렌더링)
   */
  function paint(q, el, rec, last) {
    const opts = [...el.querySelectorAll('.opt')];
    const mark = el.querySelector('.mark');
    const foot = el.querySelector('.q-foot');
    const expl = el.querySelector('.expl');

    mark.className = 'mark';
    mark.textContent = '';
    foot.className = 'q-foot';
    foot.textContent = '';
    expl.hidden = true;
    expl.replaceChildren();

    if (!rec || !rec.result) {
      opts.forEach((b) => { b.className = 'opt'; b.disabled = false; b.title = ''; });
      return;
    }

    if (rec.result === 'O') {
      // 정답 — 정답 보기를 표시. 고른 보기만 눌러서 선택 취소할 수 있다
      opts.forEach((b) => {
        const i = Number(b.dataset.i);
        b.className = 'opt' + (q.a.includes(i) ? ' correct' : '');
        b.disabled = i !== rec.choice;
        b.title = i === rec.choice ? '다시 누르면 선택이 취소됩니다' : '';
      });
      mark.classList.add('o');
      mark.textContent = 'O';
      foot.classList.add('ok');
      foot.textContent = rec.tries ? '정답입니다. (시도 ' + rec.tries + '회)' : '정답입니다.';
      if (q.e) {
        expl.innerHTML = '<b>해설</b>' + mdToHtml(q.e);
        expl.hidden = false;
      }
      return;
    }

    // 오답 — 맞출 때까지 다시 도전
    opts.forEach((b) => {
      const i = Number(b.dataset.i);
      const isLast = last ? i === last : i === rec.choice;
      b.className = 'opt' + (isLast ? ' wrong' : '');
      b.disabled = false;
      b.title = isLast ? '다시 누르면 선택이 취소됩니다' : '';
    });
    mark.classList.add('x');
    mark.textContent = 'X';
    foot.classList.add('ng');
    foot.textContent = '틀렸습니다. 다시 선택해 보세요.' + (rec.tries ? ' (시도 ' + rec.tries + '회)' : '');
  }

  /* ==================================================================
   * 대시보드
   * ================================================================== */

  function tally(list) {
    let o = 0, x = 0;
    list.forEach((q) => {
      const r = Records.get(q.y, q.n);
      if (!r || !r.result) return;
      if (r.result === 'O') o++; else x++;
    });
    return { o, x, none: list.length - o - x, total: list.length };
  }

  function renderDash() {
    const view = $('#view-dash');
    const all = tally(DATA.questions);

    const stat = (label, value, sub) =>
      '<div class="stat"><b>' + value + '</b><span>' + label + (sub ? ' · ' + sub : '') + '</span></div>';

    let html =
      '<div class="stat-row">' +
        stat('전체 문항', all.total) +
        stat('맞춤', all.o, pct(all.o, all.total)) +
        stat('틀림', all.x, pct(all.x, all.total)) +
        stat('미응시', all.none, pct(all.none, all.total)) +
      '</div>';

    // 과목별
    html += '<div class="group-title">과목별</div><div class="stat-row">';
    DATA.subjects.forEach((s) => {
      const t = tally(DATA.questions.filter((q) => q.s === s));
      html += stat(s, t.o + '/' + t.total, pct(t.o, t.total));
    });
    html += '</div>';

    // 연도별 × 문제별 그리드
    html += '<div class="group-title">연도별 · 문제별</div>';
    DATA.years.forEach((y) => {
      const list = DATA.questions.filter((q) => q.y === y);
      const t = tally(list);
      html +=
        '<div class="dash-row">' +
          '<div class="dash-head"><b>' + y + '</b>' +
            '<span>맞춤 ' + t.o + ' · 틀림 ' + t.x + ' · 미응시 ' + t.none + ' (' + pct(t.o, t.total) + ')</span>' +
          '</div>' +
          '<div class="grid">' +
            list.map((q) => {
              const r = Records.get(q.y, q.n);
              const cls = r && r.result === 'O' ? 'o' : (r && r.result === 'X' ? 'x' : '');
              return '<i class="' + cls + '" data-y="' + q.y + '" data-n="' + q.n +
                     '" title="' + q.n + '번 · ' + q.s + (r && r.result ? ' · ' + r.result : '') + '"></i>';
            }).join('') +
          '</div>' +
        '</div>';
    });

    html +=
      '<div class="legend">' +
        '<span class="l-o">맞춤</span><span class="l-x">틀림</span><span class="l-n">미응시</span>' +
        '<span style="color:var(--muted)">칸을 누르면 해당 문제로 이동합니다</span>' +
      '</div>';

    view.innerHTML = html;

    view.querySelectorAll('.grid i').forEach((cell) => {
      cell.addEventListener('click', () => {
        gotoQuestion(Number(cell.dataset.y), Number(cell.dataset.n));
      });
    });
  }

  function pct(a, b) {
    return b ? Math.round((a / b) * 100) + '%' : '0%';
  }

  /* ==================================================================
   * 과목별 모드 (기본)
   * ================================================================== */

  let curSubject = DATA.subjects[0];

  // 스와이프(스크롤 스냅) 사용 여부. 기본은 끔, 브라우저에 기억한다.
  const SWIPE_KEY = 'quiz.swipe';
  let swipeOn = false;
  try { swipeOn = localStorage.getItem(SWIPE_KEY) === '1'; } catch (e) { /* 저장소 사용 불가 */ }

  function renderSubject() {
    const view = $('#view-subject');
    view.replaceChildren();

    // 과목 선택 칩
    const chips = document.createElement('div');
    chips.className = 'chips';
    DATA.subjects.forEach((s) => {
      const b = document.createElement('button');
      b.textContent = s;
      if (s === curSubject) b.className = 'on';
      b.addEventListener('click', () => { curSubject = s; renderSubject(); window.scrollTo(0, 0); });
      chips.appendChild(b);
    });
    view.appendChild(chips);

    // 목차별로 묶는다 (목차 정보가 없는 과목은 전부 '미분류')
    const list = DATA.questions.filter((q) => q.s === curSubject);
    const groups = new Map();
    list.forEach((q) => {
      const g = q.g || UNGROUPED;
      if (!groups.has(g)) groups.set(g, { order: q.go == null ? 9999 : q.go, items: [] });
      groups.get(g).items.push(q);
    });

    const ordered = [...groups.entries()].sort((a, b) =>
      a[1].order - b[1].order || a[0].localeCompare(b[0], 'ko'));

    // 문제당 한 장씩 넘기고, 각 장 위에 목차 이름을 붙인다
    const slides = [];
    const starts = [];          // 목차별 첫 문항 위치 (오른쪽 목차용)
    ordered.forEach(([name, g]) => {
      const t = tally(g.items);
      const title = name + ' (' + g.items.length + '문항 · 맞춤 ' + t.o + ')';
      starts.push(slides.length);
      g.items.forEach((q) => slides.push({ q, title }));
    });

    if (!slides.length) {
      view.insertAdjacentHTML('beforeend', '<p class="empty">문항이 없습니다.</p>');
      setToc(null);
      return;
    }
    const go = buildSwiper(view, slides);

    setToc({
      title: curSubject + ' 목차',
      go,
      wide: true,     // 여러 연도가 섞이므로 칸에 '연도-번호'(예: 15-1)를 쓴다
      sections: () => {
        // 목차 정보가 아예 없는 과목은 목차 제목 없이 번호 칸만 보여준다
        const noToc = ordered.length === 1 && ordered[0][0] === UNGROUPED;
        return ordered.map(([name, g], i) => ({
          label: noToc ? '' : name,
          sub: g.items.length + '문항 · 맞춤 ' + tally(g.items).o,
          idx: starts[i],
          cells: g.items.map((q, j) =>
            tocCell(q, starts[i] + j, String(q.y).slice(2) + '-' + q.n)),
        }));
      },
    });
  }

  /**
   * 문제당 한 화면씩 넘기는 스와이퍼(스크롤 스냅)를 view 에 붙인다.
   * @param items [{ q, title? }] — title 이 있으면 카드 위에 표시
   * @param focusIdx 처음 보여줄 위치
   * @returns go(idx) — idx 번째 문항으로 이동하는 함수
   */
  function buildSwiper(view, items, focusIdx) {
    // 스와이프를 끄면 카드를 그대로 나열하고, 목차 이름은 바뀔 때만 붙인다
    if (!swipeOn) {
      let lastTitle;
      const anchors = items.map(({ q, title }) => {
        let h = null;
        if (title && title !== lastTitle) {
          h = document.createElement('div');
          h.className = 'group-title';
          h.textContent = title;
          view.appendChild(h);
          lastTitle = title;
        }
        const card = view.appendChild(questionCard(q));
        return h || card;     // 목차 첫 문항이면 목차 제목이 보이도록 제목으로 이동
      });
      if (focusIdx > 0) anchors[focusIdx].scrollIntoView();
      return (idx) => { if (anchors[idx]) anchors[idx].scrollIntoView({ behavior: 'smooth' }); };
    }

    const swiper = document.createElement('div');
    swiper.className = 'swiper';
    items.forEach(({ q, title }) => {
      const slide = document.createElement('div');
      slide.className = 'slide';
      if (title) {
        const h = document.createElement('div');
        h.className = 'group-title';
        h.textContent = title;
        slide.appendChild(h);
      }
      slide.appendChild(questionCard(q));
      swiper.appendChild(slide);
    });
    view.appendChild(swiper);

    // 현재 위치 표시
    const nav = document.createElement('div');
    nav.className = 'nav-float';
    nav.innerHTML =
      '<button class="btn" data-d="-1">▲</button>' +
      '<span class="pos">1 / ' + items.length + '</span>' +
      '<button class="btn" data-d="1">▼</button>';
    view.appendChild(nav);

    const slides = [...swiper.children];
    const pos = nav.querySelector('.pos');

    swiper.addEventListener('scroll', () => {
      const idx = Math.round(swiper.scrollTop / swiper.clientHeight);
      pos.textContent = Math.min(idx + 1, slides.length) + ' / ' + slides.length;
    }, { passive: true });

    nav.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-d]');
      if (!b) return;
      const idx = Math.round(swiper.scrollTop / swiper.clientHeight) + Number(b.dataset.d);
      if (slides[idx]) slides[idx].scrollIntoView({ behavior: 'smooth' });
    });

    if (focusIdx > 0) swiper.scrollTop = focusIdx * swiper.clientHeight;   // 즉시 이동
    return (idx) => swiper.scrollTo({ top: idx * swiper.clientHeight, behavior: 'smooth' });
  }

  /* ---------- 오른쪽 목차 ---------- */

  // { title, go(idx), wide?, sections() → [{ label?, sub?, idx?, cells: [{ idx, label, tip, cls }] }] }
  //   label 이 있으면 목차 제목(누르면 idx 로 이동), cells 는 문항 번호 칸
  let tocState = null;

  /** 문항 번호 칸 — 맞춤 여부를 색으로 표시 */
  function tocCell(q, idx, label) {
    const r = Records.get(q.y, q.n);
    return {
      idx,
      label,
      tip: q.y + '년 ' + q.n + '번' + (r && r.result ? ' · ' + r.result : ''),
      cls: r && r.result ? r.result.toLowerCase() : '',
    };
  }

  function setToc(state) {
    tocState = state;
    renderToc();
    updateTopBtn();     // 화면을 새로 그렸으니 맨 위로 버튼 상태도 맞춘다
  }

  /** 목차를 다시 그린다. 답을 고를 때마다 불러 맞춤 수/표시를 갱신한다. */
  function renderToc() {
    const on = !!tocState && curView !== 'dash';
    document.body.classList.toggle('has-toc', on);
    $('#btnToc').hidden = !on;
    const box = $('#tocBody');
    if (!on) { openToc(false); box.replaceChildren(); return; }

    $('#tocTitle').textContent = tocState.title;
    box.innerHTML = tocState.sections().map((s) =>
      '<div class="toc-sec">' +
        (s.label
          ? '<button class="toc-group" data-i="' + s.idx + '">' +
              '<span>' + escapeHtml(s.label) + '</span>' +
              (s.sub ? '<small>' + escapeHtml(s.sub) + '</small>' : '') +
            '</button>'
          : '') +
        '<div class="toc-grid' + (tocState.wide ? ' wide' : '') + '">' +
          s.cells.map((c) =>
            '<button data-i="' + c.idx + '" class="' + c.cls + '" title="' + escapeHtml(c.tip) + '">' +
              escapeHtml(String(c.label)) +
            '</button>'
          ).join('') +
        '</div>' +
      '</div>'
    ).join('');
  }

  function openToc(on) {
    $('#toc').classList.toggle('open', on);
    $('#scrim').hidden = !on && $('#sidebar').hidden;
  }

  $('#tocBody').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-i]');
    if (!b || !tocState) return;
    tocState.go(Number(b.dataset.i));
    openToc(false);
  });
  $('#btnToc').addEventListener('click', () => openToc(!$('#toc').classList.contains('open')));

  /* ==================================================================
   * 연도별 모드 (스크롤 스냅 = 스와이프)
   * ================================================================== */

  let curYear = DATA.years[DATA.years.length - 1];

  function renderYear(focusNum) {
    const view = $('#view-year');
    view.replaceChildren();

    const chips = document.createElement('div');
    chips.className = 'chips';
    DATA.years.forEach((y) => {
      const b = document.createElement('button');
      b.textContent = y;
      if (y === curYear) b.className = 'on';
      b.addEventListener('click', () => { curYear = y; renderYear(); });
      chips.appendChild(b);
    });
    view.appendChild(chips);

    const list = DATA.questions.filter((q) => q.y === curYear);
    const focusIdx = focusNum ? list.findIndex((q) => q.n === focusNum) : -1;
    const go = buildSwiper(view, list.map((q) => ({ q })), focusIdx);

    setToc({
      title: curYear + '년 문항',
      go,
      sections: () => [{ cells: list.map((q, i) => tocCell(q, i, q.n)) }],
    });
  }

  /** 대시보드에서 특정 문제로 이동 */
  function gotoQuestion(y, n) {
    curYear = y;
    showView('year');
    renderYear(n);
  }

  /* ==================================================================
   * 화면 전환
   * ================================================================== */

  let curView = 'subject';
  const RENDER = { dash: renderDash, subject: renderSubject, year: () => renderYear() };

  function showView(name) {
    curView = name;
    document.querySelectorAll('.tabs button').forEach((b) => {
      b.classList.toggle('on', b.dataset.view === name);
    });
    ['dash', 'subject', 'year'].forEach((v) => { $('#view-' + v).hidden = v !== name; });
    RENDER[name]();
    renderToc();
    updateTopBtn();
  }

  document.querySelector('.tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-view]');
    if (b) { showView(b.dataset.view); window.scrollTo(0, 0); }
  });

  /* ---------- 맨 위로 버튼 ---------- */

  // 스와이프 모드에서는 페이지가 아니라 스와이퍼 안쪽이 스크롤된다
  const curSwiper = () => $('#view-' + curView + ' .swiper');

  function updateTopBtn() {
    const sw = curSwiper();
    $('#btnTop').hidden = (sw ? sw.scrollTop : window.scrollY) < 300;
    $('#btnTop').classList.toggle('above-nav', !!sw);
  }

  // scroll 이벤트는 버블링되지 않으므로 캡처 단계에서 스와이퍼 스크롤까지 받는다
  document.addEventListener('scroll', updateTopBtn, { capture: true, passive: true });

  $('#btnTop').addEventListener('click', () => {
    const sw = curSwiper();
    if (sw) sw.scrollTo({ top: 0, behavior: 'smooth' });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  /* ==================================================================
   * 상태 표시 / 로그인
   * ================================================================== */

  function setStatus(msg, isError) {
    $('#status').textContent = msg || '';
    $('#status').hidden = !msg;           // 비어 있으면 자리도 차지하지 않는다
    $('#status').classList.toggle('error', !!isError);
    syncHeadHeight();            // 상태줄이 여러 줄로 늘어나면 슬라이드 높이도 바뀐다
  }

  /** 저장 진행 상황은 탭 우측 아이콘으로, 시트 연결 요약은 사이드바에 표시한다 */
  function updateSyncStatus() {
    // 저장 중이면 탭 우측에 스피너를 돌린다
    const n = Records._pending;
    $('#saving').hidden = n === 0;
    $('#saving').title = n ? '시트에 저장 중 (' + n + ')' : '';

    const info = $('#syncInfo');
    info.hidden = !Records.loaded;
    if (!Records.loaded) return;

    const answered = [...Records.map.values()].filter((r) => r.choice).length;
    let msg = '시트 "' + SHEET_NAME + '" 연결됨 · ' + Records.map.size +
              '문항 매칭 · 답안 ' + answered + '건';
    if (Records.unmatched > 0) {
      msg += ' · 시트에서 찾지 못한 문항 ' + Records.unmatched + '개';
    }
    info.textContent = msg;
    info.classList.toggle('error', Records.unmatched > 0);
  }

  /** 저장이 안 될 때 로그인 버튼을 바로 보여준다 */
  function blinkLogin() {
    if ($('#btnLogin').hidden) return;
    openSide(true);
  }

  /**
   * 연도별 모드의 한 화면 높이를 계산한다.
   * 헤더와 상태줄 높이가 글자 수/화면 폭에 따라 달라지므로 실측해서 넣는다.
   */
  function syncHeadHeight() {
    const header = document.querySelector('header').offsetHeight;
    const h = header + $('#status').offsetHeight;
    document.documentElement.style.setProperty('--head', h + 'px');
    document.documentElement.style.setProperty('--header', header + 'px');   // 오른쪽 목차 시작 위치
  }
  window.addEventListener('resize', syncHeadHeight);

  function setAuthUI(on) {
    $('#btnLogin').hidden = on;
    $('#btnLogout').hidden = !on;
    $('#authDot').classList.toggle('on', on);
    $('#authDot').title = on ? '시트에 기록 중' : '로그인하지 않음';
    $('#who').textContent = on
      ? '시트 "' + SHEET_NAME + '"에 기록합니다.'
      : '로그인하지 않아 풀이 기록이 저장되지 않습니다.';
    $('#sideInfo').textContent = on
      ? ''
      : '로그인 없이도 문제는 풀 수 있지만, 새로고침하면 결과가 사라집니다.';
  }

  /* ---------- 사이드바 ---------- */

  function openSide(on) {
    $('#sidebar').hidden = !on;
    $('#scrim').hidden = !on;
    $('#btnMenu').setAttribute('aria-expanded', String(on));
    if (on) $('#btnLogin').hidden ? $('#btnLogout').focus() : $('#btnLogin').focus();
  }

  $('#btnMenu').addEventListener('click', () => openSide(true));
  $('#btnClose').addEventListener('click', () => openSide(false));
  $('#scrim').addEventListener('click', () => { openSide(false); openToc(false); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { openSide(false); openToc(false); }
  });

  $('#optSwipe').checked = swipeOn;
  $('#optSwipe').addEventListener('change', (e) => {
    swipeOn = e.target.checked;
    try { localStorage.setItem(SWIPE_KEY, swipeOn ? '1' : '0'); } catch (err) { /* 무시 */ }
    if (curView !== 'dash') { RENDER[curView](); window.scrollTo(0, 0); }
  });

  async function loadRecords() {
    setStatus('시트를 읽는 중...');
    const { total, matched, sampleKeys } = await Records.load();
    if (matched === 0) {
      throw new Error(
        '시트 ' + total + '행을 읽었지만 key 열에서 문항을 하나도 식별하지 못했습니다. ' +
        'key 는 연도(' + DATA.years[0] + '~' + DATA.years[DATA.years.length - 1] +
        ')와 번호(1~120)를 포함해야 합니다 (예: 2021-001). ' +
        '읽은 key 예시: [' + sampleKeys.join(' | ') + ']'
      );
    }
    setStatus('');              // 연결 요약은 사이드바에 표시된다
    updateSyncStatus();
    RENDER[curView]();
  }

  $('#btnLogin').addEventListener('click', async () => {
    try {
      await GSheet.signIn();
      setAuthUI(true);
      openSide(false);
      await loadRecords();
    } catch (e) {
      setStatus(e.message, true);
    }
  });

  $('#btnLogout').addEventListener('click', () => {
    GSheet.signOut();
    Records.map.clear();
    Records.loaded = false;
    Records.unmatched = 0;
    updateSyncStatus();
    setAuthUI(false);
    openSide(false);
    setStatus('로그아웃되었습니다. 이후 기록은 저장되지 않습니다.');
    RENDER[curView]();
  });

  /* ==================================================================
   * 시작
   * ================================================================== */

  // 스크립트 오류가 조용히 사라지지 않도록 상태줄에 띄운다
  window.addEventListener('error', (e) => {
    setStatus('오류: ' + (e.message || e.error), true);
  });
  window.addEventListener('unhandledrejection', (e) => {
    setStatus('오류: ' + ((e.reason && e.reason.message) || e.reason), true);
  });

  $('#sheetLink').href = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/edit';
  setAuthUI(false);
  openSide(false);
  showView('subject');        // 과목별 모드가 기본
  setStatus('Google 인증 준비 중...');
  syncHeadHeight();

  GSheet.init().then(({ signedIn }) => {
    setAuthUI(signedIn);
    if (signedIn) return loadRecords();
    setStatus('로그인하면 풀이 기록이 시트에 저장됩니다. 로그인 없이도 문제는 풀 수 있습니다.');
  }).catch((e) => {
    setStatus(e.message, true);
    $('#btnLogin').disabled = true;
  });
  </script>
</body>
</html>
